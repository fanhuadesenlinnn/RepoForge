name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          autocrlf: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Smoke test
        shell: bash
        run: |
          bin_name="repoforge"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin_name="repoforge.exe"
          fi
          home_dir="$(mktemp -d)"
          mkdir -p "$home_dir/bin"
          go build -o "$home_dir/bin/$bin_name" .
          "$home_dir/bin/$bin_name" init
          "$home_dir/bin/$bin_name" check
          "$home_dir/bin/$bin_name" --version

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          autocrlf: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build release archive
        run: scripts/package-release.sh ci-${{ github.sha }} ${{ matrix.os }} ${{ matrix.arch }}

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: repoforge-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
