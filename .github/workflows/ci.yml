name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Linux smoke test
        run: |
          home_dir="$(mktemp -d)"
          mkdir -p "$home_dir/bin"
          go build -o "$home_dir/bin/repoforge" .
          "$home_dir/bin/repoforge" init
          "$home_dir/bin/repoforge" check
          "$home_dir/bin/repoforge" --version

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        run: scripts/package-release.sh ci-${{ github.sha }} ${{ matrix.arch }}

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: repoforge-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
