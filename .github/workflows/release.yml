name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build release archives
        run: |
          scripts/package-release.sh "${GITHUB_REF_NAME}" linux amd64
          scripts/package-release.sh "${GITHUB_REF_NAME}" linux arm64
          scripts/package-release.sh "${GITHUB_REF_NAME}" darwin amd64
          scripts/package-release.sh "${GITHUB_REF_NAME}" darwin arm64
          scripts/package-release.sh "${GITHUB_REF_NAME}" windows amd64
          scripts/package-release.sh "${GITHUB_REF_NAME}" windows arm64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "RepoForge ${GITHUB_REF_NAME}"
          fi
