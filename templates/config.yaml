schema_version: 1

app:
  name: repoforge
  language: zh_CN
  log_level: info

paths:
  home_dir: auto
  config_dir: ${home}/config
  profile_dir: ${home}/config/profiles
  template_dir: ${home}/config/templates
  repo_dir: ${home}/repos
  cache_dir: ${home}/cache
  client_dir: ${home}/client
  log_dir: ${home}/logs

default:
  backend: auto
  profile: kylin-v10-sp3-x86_64

server:
  listen: 0.0.0.0:8080
  root: ${home}/repos
  public_url: auto
  readonly: true
  directory_listing: false
  systemd:
    enabled: true
    service_name: repoforge-server
    service_file: /etc/systemd/system/repoforge-server.service
    restart: always
  firewall:
    manage: false
    port: 8080
    protocol: tcp

verify:
  check_os: true
  check_arch: true
  check_index: true
  check_local_repo: true
  check_http: true
