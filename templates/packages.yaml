# 每个 profile 对应一个目标系统，包名填写该系统的原生包名。
# 包名区分大小写，一行一个，缩进需保持一致。
#
# 以下已预置常用的基础命令行工具：
#   vim       文本编辑器
#   curl      网络请求工具
